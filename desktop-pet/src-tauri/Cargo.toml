[package]
name = "desktop-pet"
version = "0.1.0"
description = "A cross-platform desktop pet built with Tauri"
authors = ["zhang"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-notification = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
